name: Build SunPack Browser

'on':
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build mod
        run: gradle clean build modZip --no-daemon

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunpack-browser-minecraft-1.21.11
          path: |
            build/libs/sunpack-browser-1.0.0.jar
            build/distributions/sunpack-browser-1.0.0-mod.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach mod to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/sunpack-browser-1.0.0.jar
            build/distributions/sunpack-browser-1.0.0-mod.zip
